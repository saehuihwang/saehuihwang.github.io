<div class="socials">
  {%- for account in site.author -%}
    {%- assign service_name = account[0] -%}
    {%- assign service_data = site.data.social-media[service_name] -%}
    {%- if service_data -%}
      <a class="social" href="{{ service_data.url }}{{ account[1] }}"
         aria-label="{{ service_name | capitalize }}" title="{{ service_name | capitalize }}"
         {%- unless service_name == 'email' %} rel="me noopener" target="_blank"{% endunless -%}>
        <i class="{{ service_data.icon }}" aria-hidden="true"></i>
      </a>
    {%- endif -%}
  {%- endfor -%}
</div>
