<div class="timeline">
  {%- for item in site.data.timeline -%}
    <div class="timeline__item" data-reveal>
      <p class="timeline__when">{{ item.from }} &mdash; {{ item.to }}</p>
      <h3 class="timeline__what">{{ item.title }}</h3>
      {%- if item.description -%}
        <p class="timeline__desc">{{ item.description }}</p>
      {%- endif -%}
    </div>
  {%- endfor -%}
</div>
