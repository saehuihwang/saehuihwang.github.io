{%- comment -%} Skill meters, driven by _data/*-skills.yml {%- endcomment -%}
<div>
  {%- if include.title -%}<h2>{{ include.title }}</h2>{%- endif -%}
  <dl class="notes">
    {%- for skill in include.source -%}
    <div class="notes__row">
      <dt class="notes__key">{{ skill.name }}</dt>
      <dd class="notes__val">
        <span class="meter" role="img" aria-label="{{ skill.percentage }} percent">
          <span class="meter__fill" style="width: {{ skill.percentage }}%"></span>
        </span>
      </dd>
    </div>
    {%- endfor -%}
  </dl>
</div>
