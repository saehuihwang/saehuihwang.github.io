<div class="search">
  <label class="visually-hidden" for="search-input">Search posts</label>
  <input id="search-input" class="search__input" type="search" placeholder="Search posts…" autocomplete="off">
  <a class="btn btn--icon" href="{{ '/blog/tags' | relative_url }}" aria-label="Browse by tag" title="Browse by tag">
    <i class="fas fa-tags" aria-hidden="true"></i>
  </a>
</div>
<div class="search__results" id="results-container"></div>

<!-- Simple-Jekyll-Search — served from jsDelivr (rawgit, used previously, shut down in 2019) -->
<script src="https://cdn.jsdelivr.net/npm/simple-jekyll-search@1.10.0/dest/simple-jekyll-search.min.js"></script>
<script>
  SimpleJekyllSearch({
    searchInput: document.getElementById("search-input"),
    resultsContainer: document.getElementById("results-container"),
    searchResultTemplate: '<a href="{url}" class="search__result">{title}</a>',
    noResultsText: '<p class="text-faint">No results found.</p>',
    json: '{{ "/search.json" | relative_url }}'
  });
</script>
