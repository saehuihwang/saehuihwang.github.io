<!DOCTYPE html>
<html lang="en" data-theme="light">
{% include head.html %}
<body class="{% if page.url == '/' %}is-home{% endif %}">

  <a class="skip-link" href="#main">Skip to content</a>

  {% include navbar.html %}

  <main id="main" tabindex="-1">
    {{ content }}

    {%- if page.pdf -%}
    <div class="shell">
      <div id="adobe-dc-view" style="width:100%;min-height:80vh"></div>
    </div>
    <script src="https://documentservices.adobe.com/view-sdk/viewer.js"></script>
    <script>
      document.addEventListener("adobe_dc_view_sdk.ready", function () {
        new AdobeDC.View({
          clientId: "84117604f09c4651b7e9849d64d98b82",
          divId: "adobe-dc-view",
        }).previewFile(
          { content: { location: { url: "{{ '/assets/publications/Final Report.pdf' | relative_url }}" } },
            metaData: { fileName: "Main Text" } },
          { embedMode: "IN_LINE" }
        );
      });
    </script>
    {%- endif -%}
  </main>

  {% include footer.html %}

  <!-- Film grain: one fixed overlay across the whole viewport -->
  <div class="grain" aria-hidden="true"></div>

  {% include analytics.html %}
  {% include scripts.html %}
</body>
</html>
